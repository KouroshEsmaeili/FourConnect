[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connect-four-minimax"
version = "0.1.0"
description = "Connect Four with heuristic minimax search and alpha-beta pruning."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["connect-four", "minimax", "alpha-beta-pruning", "game-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
connect-four = "connect_four.cli:main"

[project.urls]
Repository = "https://github.com/KouroshEsmaeili/FourConnect"

[tool.setuptools.packages.find]
include = ["connect_four*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

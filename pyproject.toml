[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connect-four-minimax"
version = "0.1.0"
description = "Connect Four with heuristic minimax search and alpha-beta pruning."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pygame>=2.5",
]

[tool.setuptools.packages.find]
include = ["connect_four*"]
